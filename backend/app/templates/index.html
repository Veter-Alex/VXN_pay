<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tip My Code</title>
    <link rel="stylesheet" href="/static/css/landing.css">
</head>
<body class="landing-page">
    <div class="landing-container">
        <h1 class="brand-title">tip My Code</h1>
        <p class="brand-subtitle">Личный кабинет</p>

        <div class="landing-card" id="login">
            <h2 class="card-title">Вход</h2>

            {% if login_error %}
            <div class="alert alert-error">{{ login_error }}</div>
            {% endif %}

            <form method="post" action="/login" class="form">
                <label>
                    Логин
                    <input type="text" name="login" required autocomplete="username" value="{{ login_value or '' }}">
                </label>
                <label>
                    Пароль
                    <input type="password" name="password" required autocomplete="current-password">
                </label>
                <button type="submit" class="btn btn-primary">Войти</button>
            </form>
            <p class="form-footer">
                <a href="/forgot-password">Забыли логин или пароль?</a>
            </p>
        </div>
    </div>
</body>
</html>
